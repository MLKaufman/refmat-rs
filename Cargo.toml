[package]
name = "refmat"
version = "1.0.0"
edition = "2024"
description = "Build reference matrices from Seurat, SingleCellExperiment, and AnnData objects"
license = "MIT"
repository = "https://github.com/MLKaufman/refmat-rs"
readme = "README.md"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rds2rust = "=0.2.0"
hdf5 = { package = "hdf5-metno", version = "0.14.1", features = ["static", "zlib", "lzf"] }
# Force rds2rust's transitive xz decoder to compile liblzma into the binary.
lzma-sys = { version = "0.1.20", features = ["static"] }

[profile.release]
lto = "thin"
strip = true
