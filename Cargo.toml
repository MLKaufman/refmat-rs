[package]
name = "refmat"
version = "0.1.0"
edition = "2024"
description = "Inspect Seurat RDS files and build clustifyr-compatible reference matrices"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rds2rust = "=0.2.0"

[profile.release]
lto = "thin"
strip = true

